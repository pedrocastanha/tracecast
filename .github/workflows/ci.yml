name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: packages/tracecast-py
        run: pip install -e ".[all]" pytest

      - name: Run tests
        working-directory: packages/tracecast-py
        run: python -m pytest tests/ -v --tb=short

  typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: packages/tracecast-ts
        run: npm ci

      - name: Build
        working-directory: packages/tracecast-ts
        run: npx tsc

      - name: Run tests
        working-directory: packages/tracecast-ts
        run: npx jest --verbose

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [python, typescript]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        working-directory: packages/tracecast-py
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/tracecast-py/dist/
          skip-existing: true

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [python, typescript]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: packages/tracecast-ts
        run: npm ci

      - name: Build
        working-directory: packages/tracecast-ts
        run: npx tsc

      - name: Publish to NPM
        working-directory: packages/tracecast-ts
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view $(node -p "require('./package.json').name") version 2>/dev/null || echo "0.0.0")
          if [ "$CURRENT" = "$PUBLISHED" ]; then
            echo "Version $CURRENT already published, skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
